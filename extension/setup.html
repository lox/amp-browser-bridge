<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Set up Amp Browser Bridge</title>
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 620px; margin: 48px auto; padding: 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 20px; margin-top: 20px; }
  .inline-link { font-size: 13px; }
  footer { margin-top: 16px; font-size: 13px; }
  footer a { white-space: nowrap; }
</style>
<main>
  <h1>Amp Browser Bridge<small>Lend one Chrome tab to your Amp threads across orbs and runners.</small></h1>
  <div class="card">
    <ol class="steps">
      <li class="step" id="relay">
        <span class="dot"></span>
        <div>
          <h2>Connected to reflector</h2>
          <div class="detail"></div>
          <div class="row">
            <button id="reconnect" class="hidden">Reconnect</button>
            <a href="#" id="toggleRelay" class="inline-link">Change reflector</a>
          </div>
          <div id="relayForm" class="row hidden">
            <input id="relayInput" type="text" placeholder="https://amp-browser-bridge.fly.dev" autocomplete="off" spellcheck="false">
            <button id="saveRelay" class="primary">Save</button>
            <button id="resetRelay" class="hidden">Use default</button>
          </div>
          <p id="relayError" class="error hidden"></p>
        </div>
      </li>
      <li class="step" id="amp">
        <span class="dot"></span>
        <div>
          <h2>Connected with Amp</h2>
          <div class="detail"></div>
          <div class="row">
            <button id="copyKey" class="primary">Copy setup key</button>
            <button id="rotateKey">Rotate key</button>
            <span id="copyNote" class="muted"></span>
          </div>
        </div>
      </li>
      <li class="step" id="lent">
        <span class="dot"></span>
        <div><h2>A tab is lent</h2><div class="detail"></div></div>
      </li>
    </ol>
  </div>
  <footer class="muted">End-to-end encrypted: the reflector sees only ciphertext.
    <a href="https://github.com/lox/amp-browser-bridge#readme" target="_blank">How it works</a></footer>
</main>
<script src="setup.js"></script>
