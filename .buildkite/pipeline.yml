# Runs `bun run check` and the headless-Chrome end-to-end tests (test/e2e). node:24 rather than
# oven/bun, because oven/bun's `node` is Bun, and `node --check` would then run
# extension/background.js instead of only parsing it.
x-docker: &docker
  docker#v5.14.0:
    image: node:24-trixie
    always-pull: true
    # Keeps root-owned node_modules out of the agent's checkout.
    volumes:
      - /workdir/node_modules

steps:
  - label: ":bun: check"
    command:
      - npm install -g bun@1.4
      - bun install --frozen-lockfile
      - bun run check
    plugins:
      - *docker

  - label: ":chrome: e2e"
    command:
      - npm install -g bun@1.4
      - apt-get update -qq
      - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends chromium
      - bun install --frozen-lockfile
      - CHROME_BIN=/usr/bin/chromium bun run e2e
    timeout_in_minutes: 15
    plugins:
      - *docker
