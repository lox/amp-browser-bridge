<!doctype html><title>Sign in</title>
<h1>Sign in</h1>
<form id="f" onsubmit="event.preventDefault(); const p = document.getElementById('password'); document.getElementById('out').textContent = p.value ? 'Signed in as ' + document.getElementById('user').value : 'Password required'">
<label>Username <input id="user"></label>
<label>Password <input id="password" type="password"></label>
<button>Sign in</button>
</form>
<p id="out">Signed out</p>
