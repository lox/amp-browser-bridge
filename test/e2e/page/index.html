<!doctype html><title>Bridge test page</title>
<h1>Bridge test</h1>
<form onsubmit="event.preventDefault(); document.getElementById('out').textContent = 'Submitted: ' + document.getElementById('q').value">
<label>Search <input id="q" value="old"></label>
<button type="button" onclick="document.getElementById('out').textContent='Clicked!'">Press me</button>
</form>
<p id="out">Nothing yet</p>
<a href="/other.html">Other page</a>
<button id="covered" onclick="document.getElementById('out').textContent='Covered clicked!'">Covered</button>
<div id="overlay" style="position:fixed;inset:0;z-index:1;background:transparent;display:none" onclick="document.getElementById('out').textContent='Overlay got it'"></div>
<label><input type="checkbox" id="cb" style="position:absolute;clip:rect(0 0 0 0);width:1px;height:1px;margin:0"><span style="display:inline-block;padding:4px">Agree</span></label>
<!-- Synology DSM's checkbox: the input is 1px and see-through, and a sibling sprite drawn on top of it shows the state.
     Like DSM, a click on the sprite or on the input (as a label click forwards) toggles that state. -->
<div class="x-form-check-wrap" style="position:relative;height:22px"><input type="checkbox" id="dsm" onclick="document.getElementById('dsm-icon').classList.toggle('on')" style="width:1px;height:1px;margin:5px 0 0 5px;opacity:0"><div id="dsm-icon" style="position:absolute;left:0;top:0;width:22px;height:22px;background:#ccc" onclick="this.classList.toggle('on')"></div><label for="dsm" style="padding-left:26px">Enable Recycle Bin</label></div>
<div style="position:relative;height:22px"><input type="checkbox" id="plain" style="width:1px;height:1px;margin:5px 0 0 5px;opacity:0"><div style="position:absolute;left:0;top:0;width:22px;height:22px;background:#ccc" onclick="document.getElementById('out').textContent='Sibling got it'"></div><label for="plain" style="padding-left:26px">Accept terms</label></div>
<div style="position:relative;height:22px"><input type="checkbox" id="tos" style="width:1px;height:1px;margin:5px 0 0 5px;opacity:0"><div style="position:absolute;left:0;top:0;width:22px;height:22px;background:#ccc"></div><label for="tos" style="padding-left:26px"><a href="#tos" onclick="document.getElementById('out').textContent='Link got it'">Read the terms</a></label></div>
<div style="position:relative;height:22px"><button onclick="document.getElementById('out').textContent='Hidden button clicked'">Hidden button</button><div style="position:absolute;left:0;top:0;width:100%;height:22px;background:#ccc"></div></div>
